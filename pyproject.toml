[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-recall-lab"
version = "0.1.0"
description = "Evidence-backed memory for coding agents, with measurable recall"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
]

[project.scripts]
recall = "recall_lab.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/recall_lab"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
